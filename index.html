<body>
<title>KORD</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
/* Layout: step 1 is a grid of school tiles. Step 2 is that school's page: a header in the school's color,
   a day strip, and one list of deals sorted cheapest first, drawn as tear-off tickets with the price on the stub. */
:root {
  --bg: #FFFCF7; --card: #FFFFFF; --ink: #1B1410; --muted: #6E625A; --line: #EBE2D8; --chip: #F4EDE4;
  --hot: #FF3B2F; --sun: #FFC91F; --sun-ink: #1B1410;
  --cobalt: #2F4BFF; --mint: #00A870; --grape: #8A3FFC; --pink: #F0338C; --orange: #FF7A1A; --teal: #0097A7;
  --link: #2F4BFF; --shadow: 0 2px 0 rgba(27,20,16,.08), 0 10px 24px -14px rgba(27,20,16,.35);
  --display: "Bricolage Grotesque", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --gl: max(16px, env(safe-area-inset-left, 0px)); --gr: max(16px, env(safe-area-inset-right, 0px));
  --sc: #FF3B2F; --si: #FFFFFF;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15100D; --card: #231B16; --ink: #FFF5E9; --muted: #B5A698; --line: #3A2E26; --chip: #2E241D;
  --hot: #FF4A3D; --cobalt: #7088FF; --mint: #19C98C; --grape: #A970FF; --pink: #FF5AA5; --orange: #FF8A33; --teal: #25B8C8;
  --link: #8FA2FF; --shadow: 0 2px 0 rgba(0,0,0,.4), 0 10px 24px -14px rgba(0,0,0,.8); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #15100D; --card: #231B16; --ink: #FFF5E9; --muted: #B5A698; --line: #3A2E26; --chip: #2E241D;
  --hot: #FF4A3D; --cobalt: #7088FF; --mint: #19C98C; --grape: #A970FF; --pink: #FF5AA5; --orange: #FF8A33; --teal: #25B8C8;
  --link: #8FA2FF; --shadow: 0 2px 0 rgba(0,0,0,.4), 0 10px 24px -14px rgba(0,0,0,.8); color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.45 var(--body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sc); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
a { color: var(--link); }
:focus-visible { outline: 3px solid var(--cobalt); outline-offset: 2px; }
.wrap { max-width: 600px; margin-inline: auto; padding-left: var(--gl); padding-right: var(--gr); }

/* header */
.top { background: var(--sc); color: var(--si); margin-top: calc(-1 * env(safe-area-inset-top, 0px)); padding-top: calc(env(safe-area-inset-top, 0px) + 14px); padding-bottom: 16px; }
.brand { font: 800 22px/1 var(--display); letter-spacing: -.02em; display: flex; align-items: center; gap: 7px; }
.brand i { width: 12px; height: 12px; border-radius: 50%; background: var(--sun); display: block; }
.intro h1 { font: 800 clamp(34px, 10vw, 46px)/.98 var(--display); letter-spacing: -.03em; margin: 18px 0 6px; text-wrap: balance; }
.intro p { margin: 0; font-size: 16px; font-weight: 500; }
.schoolbar { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
.schoolbar .mid { flex: 1; min-width: 0; }
.schoolbar h1 { font: 800 clamp(22px, 6.5vw, 30px)/1.02 var(--display); letter-spacing: -.02em; margin: 0; overflow-wrap: anywhere; }
.schoolbar p { margin: 2px 0 0; font-size: 13px; font-weight: 500; opacity: .92; }
.swap { flex: none; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,.22); color: inherit; font-weight: 700; font-size: 13px; }

/* school badge */
.badge { --c: var(--hot); --i: #fff; position: relative; width: 56px; height: 56px; flex: none; border-radius: 16px; background: var(--c); color: var(--i); display: grid; place-items: center; overflow: hidden; font: 800 17px/1 var(--display); letter-spacing: -.02em; }
.badge img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; padding: 6px; background: #fff; opacity: 0; }
.tile .badge { width: 72px; height: 72px; border-radius: 18px; }
.tile .badge.has { box-shadow: inset 0 0 0 1px var(--line); }
.badge.has img { opacity: 1; }
.top .badge { box-shadow: 0 0 0 2px rgba(255,255,255,.7); }

/* school grid */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; text-align: left; padding: 14px; border-radius: 18px; background: var(--card); box-shadow: var(--shadow); min-width: 0; }
.tname { display: block; font: 800 16px/1.12 var(--display); letter-spacing: -.01em; }
.tsub { display: block; font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.tile.mine { outline: 3px solid var(--ink); }

/* day strip */
.days { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.days .wrap { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding-block: 8px; }
.day { border-radius: 12px; padding: 9px 0; text-align: center; font: 800 15px/1.1 var(--display); min-width: 0; }
.day small { display: block; font: 700 10px/1.2 var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--hot); height: 12px; }
.day[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.day[aria-pressed="true"] small { color: var(--sun); }

main { padding-block: 16px calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; min-height: 60vh; }
main.nopad { padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px)); }
h2 { font: 800 22px/1.1 var(--display); letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: 14px; margin: 3px 0 0; }
.sechead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-top: 8px; }
.sechead span { color: var(--muted); font-size: 13px; font-weight: 700; flex: none; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--chip); border-radius: 12px; padding: 3px; }
.seg button { padding: 8px; border-radius: 10px; font-weight: 700; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
.search { width: 100%; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); }
.search:focus { border-color: var(--ink); outline: none; }

/* logo tile */
.lg { --c: var(--hot); position: relative; width: 48px; height: 48px; flex: none; border-radius: 13px; background: var(--c); color: #fff; display: grid; place-items: center; overflow: hidden; font: 800 17px var(--display); }
.lg img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; padding: 7px; background: #fff; opacity: 0; }
.lg.has img { opacity: 1; }
.lg.has { box-shadow: inset 0 0 0 1px var(--line); }
.lg.big { width: 68px; height: 68px; border-radius: 18px; font-size: 24px; }

/* deal ticket */
.ticket { --c: var(--hot); display: grid; grid-template-columns: 96px minmax(0, 1fr); width: 100%; text-align: left; background: var(--card); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.stub { background: var(--c); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px 6px; text-align: center;
  -webkit-mask: radial-gradient(circle 7px at 100% 0, #0000 98%, #000) top/100% 51% no-repeat, radial-gradient(circle 7px at 100% 100%, #0000 98%, #000) bottom/100% 51% no-repeat;
  mask: radial-gradient(circle 7px at 100% 0, #0000 98%, #000) top/100% 51% no-repeat, radial-gradient(circle 7px at 100% 100%, #0000 98%, #000) bottom/100% 51% no-repeat; }
.stub b { font: 800 26px/1 var(--display); letter-spacing: -.02em; overflow-wrap: anywhere; }
.stub b.long { font-size: 17px; }
.tbody { padding: 12px 14px; border-left: 2px dashed var(--line); min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.tbody h3 { margin: 0; font: 800 17px/1.15 var(--display); letter-spacing: -.01em; }
.tbody .at { font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tbody p { margin: 0; color: var(--muted); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: 6px; background: var(--chip); color: var(--muted); }
.tag.sig { background: var(--sun); color: var(--sun-ink); }
.tag.stu { background: var(--cobalt); color: #fff; }
.ticket.hero { grid-template-columns: 1fr; background: var(--ink); color: var(--bg); }
.ticket.hero .stub { flex-direction: row; justify-content: space-between; align-items: center; padding: 14px 16px; -webkit-mask: none; mask: none; }
.ticket.hero .stub b { font-size: 44px; }
.ticket.hero .stub b.long { font-size: 28px; }
.ticket.hero .stub small { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.ticket.hero .tbody { border-left: 0; padding: 14px 16px 16px; }
.ticket.hero .tbody h3 { font-size: 24px; }
.ticket.hero .tbody .at { font-size: 16px; }
.ticket.hero .tbody p { color: inherit; opacity: .8; font-size: 14px; }
.ticket.hero .tag { background: rgba(127,127,127,.3); color: inherit; }
.list { display: flex; flex-direction: column; gap: 10px; }

/* deal photo cards */
.dcard { --c: var(--hot); display: grid; grid-template-columns: 118px minmax(0, 1fr); width: 100%; text-align: left; background: var(--card); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
.ph { position: relative; display: block; background: var(--c); min-height: 112px; }
.ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.price { position: absolute; left: 8px; bottom: 8px; max-width: calc(100% - 16px); background: var(--sun); color: var(--sun-ink); font: 800 20px/1 var(--display); letter-spacing: -.02em; padding: 6px 9px; border-radius: 10px; transform: rotate(-4deg); box-shadow: 0 2px 0 rgba(0,0,0,.4); }
.price.long { font-size: 13.5px; }
.dbody { display: flex; flex-direction: column; justify-content: center; gap: 7px; padding: 12px 14px; min-width: 0; }
.dtitle { font: 800 17px/1.15 var(--display); letter-spacing: -.01em; }
.who { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13.5px; min-width: 0; }
.who > span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lg.sm { width: 26px; height: 26px; border-radius: 8px; font-size: 10px; }
.lg.sm img { padding: 2px; }
.lg img.cover { object-fit: cover; padding: 0; }
.ddet { color: var(--muted); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.dcard.hero { grid-template-columns: 1fr; }
.dcard.hero .ph { aspect-ratio: 16 / 10; min-height: 0; }
.dcard.hero .ph::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.4), rgba(0,0,0,0) 34%, rgba(0,0,0,0) 58%, rgba(0,0,0,.5)); }
.dcard.hero .price { z-index: 1; left: 14px; bottom: 14px; font-size: 42px; padding: 8px 14px; border-radius: 14px; }
.dcard.hero .price.long { font-size: 25px; }
.flag { position: absolute; z-index: 1; left: 14px; top: 12px; background: var(--hot); color: #fff; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; }
.dcard.hero .dbody { padding: 14px 16px 16px; gap: 9px; }
.dcard.hero .dtitle { font-size: 24px; }
.dcard.hero .who { font-size: 15px; }
.dcard.hero .lg.sm { width: 34px; height: 34px; border-radius: 10px; }
.banner { position: relative; height: 150px; border-radius: 16px; overflow: hidden; background: var(--c); flex: none; }
.banner img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.credits { font-size: 12px; color: var(--muted); }
.credits summary { font-weight: 700; cursor: pointer; padding: 6px 0; }
.credits li { margin: 4px 0; overflow-wrap: anywhere; }

/* place rows */
.row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 10px 12px; background: var(--card); border-radius: 14px; box-shadow: var(--shadow); }
.row .mid { flex: 1; min-width: 0; }
.row h3 { margin: 0; font: 800 16px/1.2 var(--display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row p { margin: 1px 0 0; font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .end { flex: none; text-align: right; font-size: 11.5px; font-weight: 700; color: var(--muted); }
.row .end b { display: block; font: 800 18px/1.1 var(--display); color: var(--mint); }
.mystars { color: var(--orange); font-weight: 800; letter-spacing: 1px; font-size: 13px; }
.stars { display: inline-flex; gap: 2px; }
.stars button { font-size: 38px; line-height: 1; color: var(--line); padding: 2px; }
.stars button.on { color: var(--sun); -webkit-text-stroke: .5px var(--sun-ink); }

.empty { border: 2px dashed var(--line); border-radius: 16px; padding: 22px 18px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--ink); font: 800 18px var(--display); margin-bottom: 4px; }
.note { font-size: 12px; color: var(--muted); margin: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 12px 16px; border-radius: 12px; background: var(--ink); color: var(--bg); font-weight: 700; text-decoration: none; }
.btn.hot { background: var(--hot); color: #fff; }
.btn.ghost { background: var(--chip); color: var(--ink); }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }

/* tabs */
.tabs { position: fixed; inset: auto 0 0; z-index: 6; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs .wrap { display: grid; grid-template-columns: repeat(3, 1fr); }
.tab { padding: 10px 0 9px; text-align: center; font-size: 12px; font-weight: 700; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; }
.tab svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--hot); }

/* sheet */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(15,10,8,.55); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 600px; max-height: 92%; border-radius: 22px 22px 0 0; display: flex; flex-direction: column; overflow: hidden; }
.sheethead { display: flex; justify-content: flex-end; padding: 12px var(--gr) 0 var(--gl); }
.x { width: 36px; height: 36px; border-radius: 50%; background: var(--chip); font-size: 20px; line-height: 1; flex: none; }
.sheetbody { overflow-y: auto; padding: 0 var(--gr) calc(24px + env(safe-area-inset-bottom, 0px)) var(--gl); display: flex; flex-direction: column; gap: 14px; }
.spothead { display: flex; gap: 14px; align-items: center; }
.spothead h2 { font-size: 26px; overflow-wrap: anywhere; }
.week { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--card); }
.wd { display: grid; grid-template-columns: 52px minmax(0, 1fr); border-top: 1px solid var(--line); }
.wd:first-child { border-top: 0; }
.wd > b { padding: 11px 0 11px 12px; font: 800 14px var(--display); }
.wd.sel > b { color: var(--hot); }
.wd > div { padding: 10px 12px 10px 4px; display: flex; flex-direction: column; gap: 8px; }
.wdeal strong { display: block; font-size: 14px; }
.wdeal span { display: block; font-size: 13px; color: var(--muted); }
.wdeal a { font-size: 12px; font-weight: 700; }
.field { display: flex; flex-direction: column; gap: 5px; font-weight: 700; font-size: 13px; }
.field input, .field textarea { padding: 11px 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); font-weight: 500; width: 100%; }
.field textarea { min-height: 76px; resize: vertical; }
.me { display: flex; gap: 14px; align-items: center; }
.avatar { width: 84px; height: 84px; border-radius: 50%; background: var(--sun); color: var(--sun-ink); display: grid; place-items: center; font: 800 32px var(--display); overflow: hidden; flex: none; border: 2px solid var(--ink); }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.row .quote { margin: 4px 0 0; font-size: 13px; white-space: normal; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .22s ease-out; } @keyframes up { from { transform: translateY(40px); opacity: .6; } } }
</style>

</div></nav>

<script>
(function () {
  'use strict';
  var DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  var DAYNAME = { Mon: 'Monday', Tue: 'Tuesday', Wed: 'Wednesday', Thu: 'Thursday', Fri: 'Friday', Sat: 'Saturday', Sun: 'Sunday' };
  var CATCOLOR = { 'Pizza': 'hot', 'Burgers': 'orange', 'Mexican': 'mint', 'Sandwiches & Subs': 'cobalt', 'Wings & Chicken': 'orange', 'Asian': 'pink',
    'Boba & Tea': 'grape', 'Coffee & Bakery': 'teal', 'Breakfast & Brunch': 'orange', 'Bar & Grill': 'cobalt', 'Dessert & Ice Cream': 'pink', 'BBQ': 'hot',
    'Mediterranean': 'teal', 'Healthy & Bowls': 'mint', 'Fast Food': 'hot', 'Other': 'grape' };
  var NOLOGO = /(^|\.)(facebook|instagram|x|twitter|linktr|toasttab|google|yelp|tripadvisor|doordash|grubhub|ubereats|square|wixsite|wordpress|business|spoton|toast)\./;
  var TODAY = DAYS[(new Date().getDay() + 6) % 7];
  var DATA = null, SPOTS = {};
  var S = load('kord.prefs', { town: '', tab: 'deals' });
  S.day = TODAY; S.localOnly = false; S.q = ''; S.picking = false;
  if (['deals', 'places', 'you'].indexOf(S.tab) < 0) S.tab = 'deals';
  var U = load('kord.user', { name: '', avatar: '', ratings: {}, notes: {} });
  U.ratings = U.ratings || {}; U.notes = U.notes || {};

  function load(k, d) { try { var v = JSON.parse(localStorage.getItem(k)); return v && typeof v === 'object' ? v : d; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function safeUrl(u) { return /^https:\/\//i.test(u || '') ? u : (/^http:\/\//i.test(u || '') ? u.replace(/^http:/i, 'https:') : ''); }
  function domain(u) { try { return new URL(safeUrl(u)).hostname.replace(/^www\./, ''); } catch (e) { return ''; } }
  function initials(n) { var w = String(n).replace(/[^A-Za-z0-9 ]/g, '').split(/\s+/).filter(function (x) { return x && !/^(the|of|and)$/i.test(x); }); return ((w[0] || '?')[0] + (w[1] ? w[1][0] : '')).toUpperCase(); }
  function color(cat) { return 'var(--' + (CATCOLOR[cat] || 'grape') + ')'; }
  function hex(c) { return /^#[0-9a-f]{6}$/i.test(c || '') ? c : '#FF3B2F'; }
  function priceNum(p) { var m = /\$\s?(\d+(?:\.\d+)?)/.exec(p || ''); if (m) return parseFloat(m[1]); m = /(\d+)\s?(?:¢|cents?)/i.exec(p || ''); return m ? parseFloat(m[1]) / 100 : null; }
  function stubText(d) {
    var p = (d.price || '').trim();
    if (p && p.length <= 9) return p;
    var m = /\$\s?\d+(?:\.\d+)?/.exec(p + ' ' + d.title) || /\d+\s?% off/i.exec(p + ' ' + d.title) || /half[- ]price|half off|bogo|free/i.exec(p + ' ' + d.title);
    return m ? m[0].replace(/\s/g, m[0][0] === '$' ? '' : ' ').toUpperCase() : 'DEAL';
  }
  function town() { return DATA.towns.find(function (t) { return t.id === S.town; }); }
  function fav(d) { return 'https://www.google.com/s2/favicons?sz=128&domain=' + encodeURIComponent(d); }
  function logo(sp, cls) {
    var d = domain(sp.website), img = '';
    if (sp.logo) img = '<img alt="" loading="lazy" data-logo src="' + esc(sp.logo) + '">';
    else if (photo(sp.photo)) img = '<img alt="" loading="lazy" class="cover" data-logo src="' + esc(photo(sp.photo)) + '">';
    else if (d && !NOLOGO.test(d + '.')) img = '<img alt="" loading="lazy" data-logo src="' + fav(d) + '">';
    return '<span class="lg ' + (cls || '') + '" style="--c:' + color(sp.category) + '"><span>' + esc(initials(sp.name)) + '</span>' + img + '</span>';
  }
  function badge(sc) {
    var d = domain(sc.url), src = sc.logo || (d ? fav(d) : '');
    return '<span class="badge" style="--c:' + hex(sc.color) + ';--i:' + hex(sc.ink) + '"><span>' + esc(sc.abbr) + '</span>' + (src ? '<img alt="" data-logo src="' + esc(src) + '">' : '') + '</span>';
  }
  document.addEventListener('load', function (e) { var t = e.target; if (t && t.dataset && 'logo' in t.dataset) { if (t.naturalWidth >= 32) t.parentNode.classList.add('has'); else t.remove(); } }, true);
  document.addEventListener('error', function (e) { var t = e.target; if (t && t.dataset && 'logo' in t.dataset) t.remove(); }, true);

  function dealsFor(t, day) {
    var out = [];
    t.spots.forEach(function (sp) { (sp.deals || []).forEach(function (d) { if (d.days.indexOf(day) >= 0) out.push({ sp: sp, d: d }); }); });
    return out;
  }
  /* cheapest first: dollar prices low to high, then percent-off and other deals; local spots win ties */
  function cheapest(a) {
    return a.sort(function (x, y) {
      var px = priceNum(x.d.price || x.d.title), py = priceNum(y.d.price || y.d.title);
      if (px == null && py != null) return 1; if (py == null && px != null) return -1;
      if (px != null && px !== py) return px - py;
      return (y.sp.local ? 1 : 0) - (x.sp.local ? 1 : 0) || x.sp.name.localeCompare(y.sp.name);
    });
  }
  function spotLow(sp) { var lo = null; (sp.deals || []).forEach(function (d) { var p = priceNum(d.price || d.title); if (p != null && (lo == null || p < lo)) lo = p; }); return lo; }
  function money(n) { return '$' + (n % 1 ? n.toFixed(2) : n); }
  function tagsHtml(sp, d) {
    var h = '';
    if (sp.signature) h += '<span class="tag sig">Student favorite</span>';
    if (d && d.studentOnly) h += '<span class="tag stu">Show student ID</span>';
    if (!sp.local) h += '<span class="tag">Chain</span>';
    return h ? '<span class="tags">' + h + '</span>' : '';
  }
  function photo(key) { var p = key && DATA.photos && DATA.photos[key]; return p ? p.src : ''; }
  function ticket(x, hero) {
    var st = stubText(x.d), ph = photo(x.d.photo || x.sp.photo);
    return '<button class="dcard' + (hero ? ' hero' : '') + '" data-spot="' + esc(x.sp.id) + '" style="--c:' + color(x.sp.category) + '">' +
      '<span class="ph">' + (ph ? '<img alt="" loading="lazy" src="' + esc(ph) + '">' : '') +
      (hero ? '<span class="flag">Cheapest ' + (S.day === TODAY ? 'today' : DAYNAME[S.day]) + '</span>' : '') +
      '<span class="price' + (st.length > 5 ? ' long' : '') + '">' + esc(st) + '</span></span>' +
      '<span class="dbody"><span class="dtitle">' + esc(x.d.title) + '</span>' +
      '<span class="who">' + logo(x.sp, 'sm') + '<span>' + esc(x.sp.name) + '</span></span>' +
      (hero ? '<span class="ddet">' + esc(x.d.details) + '</span>' : '') + tagsHtml(x.sp, x.d) + '</span></button>';
  }

  /* step 1: pick a school */
  function viewPick() {
    return '<div class="grid">' + DATA.towns.map(function (t) {
      return '<button class="tile' + (t.id === S.town ? ' mine' : '') + '" data-town="' + esc(t.id) + '">' + badge(t.school) +
        '<span><span class="tname">' + esc(t.school.name) + '</span><span class="tsub">' + esc(t.name) + (t.school.also ? ' · also ' + esc(t.school.also) : '') + '</span></span></button>';
    }).join('') + '</div><p class="note">15 Ohio schools so far. More coming.</p>';
  }
  /* step 2: cheapest deals for the day */
  function viewDeals() {
    var t = town(), all = dealsFor(t, S.day);
    var list = cheapest(all.filter(function (x) { return !S.localOnly || x.sp.local; }));
    var when = S.day === TODAY ? 'today' : 'on ' + DAYNAME[S.day];
    var h = '<div><h2>Cheapest food ' + when + '</h2><p class="sub">Lowest price first. Tap a deal to see the place.</p></div>' +
      '<div class="seg"><button data-local="0" aria-pressed="' + !S.localOnly + '">Everything</button><button data-local="1" aria-pressed="' + S.localOnly + '">Local spots only</button></div>';
    if (!list.length) {
      var other = DAYS.filter(function (d) { return dealsFor(t, d).length; });
      h += '<div class="empty"><b>No deals found for ' + DAYNAME[S.day] + '</b>' + (all.length ? 'Switch to Everything to see chain deals.' : other.length ? 'Try ' + other.map(function (d) { return DAYNAME[d]; }).join(', ') + '.' : 'Check Places for where to eat.') + '</div>';
    } else {
      h += ticket(list[0], true);
      if (list.length > 1) h += '<div class="sechead"><h2>More deals</h2><span>' + (list.length - 1) + '</span></div><div class="list">' + list.slice(1).map(function (x) { return ticket(x); }).join('') + '</div>';
    }
    return h + '<p class="note">Deals change. Each one links to where we found it, so check before you go. Food photos show the kind of dish, not the restaurant\'s own plate.</p>';
  }
  function spotRow(sp) {
    var lo = spotLow(sp), n = (sp.deals || []).length, r = U.ratings[sp.id];
    return '<button class="row" data-spot="' + esc(sp.id) + '">' + logo(sp) +
      '<span class="mid"><h3>' + esc(sp.name) + '</h3><p>' + esc(sp.category) + (sp.price ? ' · ' + esc(sp.price) : '') + (r ? ' · <span class="mystars">' + '★'.repeat(r) + '</span>' : '') + '</p></span>' +
      '<span class="end">' + (lo != null ? 'from<b>' + money(lo) + '</b>' : n ? '<b>' + n + '</b>deal' + (n > 1 ? 's' : '') : '') + '</span></button>';
  }
  function viewPlaces() {
    var t = town(), q = S.q.toLowerCase();
    var list = t.spots.filter(function (s) { return !q || (s.name + ' ' + s.category).toLowerCase().indexOf(q) >= 0; });
    list.sort(function (a, b) { var x = spotLow(a), y = spotLow(b); if (x == null && y == null) return (b.deals.length - a.deals.length) || a.name.localeCompare(b.name); if (x == null) return 1; if (y == null) return -1; return x - y; });
    var loc = list.filter(function (s) { return s.local; }), ch = list.filter(function (s) { return !s.local; });
    function sec(title, a) { return a.length ? '<div class="sechead"><h2>' + title + '</h2><span>' + a.length + '</span></div><div class="list">' + a.map(spotRow).join('') + '</div>' : ''; }
    return '<div><h2>Where to eat in ' + esc(t.name) + '</h2><p class="sub">Tap a place to see its deals for the week and leave your review.</p></div>' +
      '<input class="search" id="spotSearch" type="search" placeholder="Search pizza, tacos, a name…" value="' + esc(S.q) + '" aria-label="Search places">' +
      (list.length ? sec('Local spots', loc) + sec('Chains', ch) : '<div class="empty"><b>Nothing matches</b>Try a different word.</div>');
  }
  function viewYou() {
    var rated = Object.keys(U.ratings).filter(function (id) { return SPOTS[id]; }).sort(function (a, b) { return U.ratings[b] - U.ratings[a]; });
    var h = '<div class="me"><span class="avatar">' + (U.avatar ? '<img alt="" src="' + esc(U.avatar) + '">' : esc(U.name ? initials(U.name) : '?')) + '</span>' +
      '<div><h2>' + esc(U.name || 'Your profile') + '</h2><p class="sub">' + esc(town().school.name) + '</p>' +
      '<div class="btnrow" style="margin-top:8px"><label class="btn ghost" for="avatarFile">Add a photo</label><input id="avatarFile" type="file" accept="image/*" hidden></div></div></div>' +
      '<label class="field" for="nameIn">Your name<input id="nameIn" type="text" maxlength="30" autocomplete="nickname" placeholder="What should we call you?" value="' + esc(U.name) + '"></label>' +
      '<div class="sechead"><h2>Your reviews</h2><span>' + rated.length + '</span></div>';
    h += rated.length ? '<div class="list">' + rated.map(function (id) {
      var sp = SPOTS[id];
      return '<button class="row" data-spot="' + esc(id) + '">' + logo(sp) + '<span class="mid"><h3>' + esc(sp.name) + '</h3><p><span class="mystars">' + '★'.repeat(U.ratings[id]) + '</span></p>' + (U.notes[id] ? '<p class="quote">' + esc(U.notes[id]) + '</p>' : '') + '</span></button>';
    }).join('') + '</div>' : '<div class="empty"><b>No reviews yet</b>Open any place and tap the stars.</div>';
    h += '<p class="note">Your profile and reviews are saved on this phone.</p>';
    var keys = Object.keys(DATA.photos || {});
    if (keys.length) h += '<details class="credits"><summary>Photo credits</summary><ul>' + keys.map(function (k) {
      var p = DATA.photos[k], u = safeUrl(p.page);
      return '<li>' + (u ? '<a target="_blank" rel="noopener" href="' + esc(u) + '">' + esc(p.title) + '</a>' : esc(p.title)) + ' by ' + esc(p.artist || 'unknown') + ', ' + esc(p.license) + ', via Wikimedia Commons</li>';
    }).join('') + '</ul></details>';
    return h;
  }

  function render() {
    var t = DATA && town(), picking = S.picking || !t, root = document.documentElement;
    root.style.setProperty('--sc', picking ? '' : hex(t.school.color)); root.style.setProperty('--si', picking ? '' : hex(t.school.ink));
    if (picking) { root.style.removeProperty('--sc'); root.style.removeProperty('--si'); }
    document.getElementById('top').innerHTML = '<div class="brand"><i></i>KORD</div>' + (picking ?
      '<div class="intro"><h1>Cheap eats near campus.</h1><p>Pick your school to see today\'s deals.</p></div>' :
      '<div class="schoolbar">' + badge(t.school) + '<div class="mid"><h1>' + esc(t.school.name) + '</h1><p>' + esc(t.name) + ', Ohio</p></div><button class="swap" id="swapBtn">Change</button></div>');
    document.getElementById('tabs').hidden = picking;
    document.getElementById('daysNav').hidden = picking || S.tab !== 'deals';
    var v = document.getElementById('view'); v.className = 'wrap' + (picking ? ' nopad' : '');
    if (picking) { v.innerHTML = viewPick(); return; }
    document.getElementById('days').innerHTML = DAYS.map(function (d) {
      return '<button class="day" data-day="' + d + '" aria-pressed="' + (S.day === d) + '" aria-label="' + DAYNAME[d] + '"><small>' + (d === TODAY ? 'Today' : '') + '</small>' + d + '</button>';
    }).join('');
    document.querySelectorAll('.tab').forEach(function (b) { if (b.dataset.tab === S.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    v.innerHTML = S.tab === 'places' ? viewPlaces() : S.tab === 'you' ? viewYou() : viewDeals();
    save('kord.prefs', { town: S.town, tab: S.tab });
  }

  /* place sheet */
  function closeSheet() { document.getElementById('sheetRoot').innerHTML = ''; }
  function starsHtml(id) { var r = U.ratings[id] || 0, h = ''; for (var i = 1; i <= 5; i++) h += '<button class="' + (i <= r ? 'on' : '') + '" data-rate="' + i + '" data-id="' + esc(id) + '" aria-label="' + i + ' star' + (i > 1 ? 's' : '') + '">★</button>'; return '<div class="stars" role="group" aria-label="Your rating">' + h + '</div>'; }
  function spotSheet(id) {
    var sp = SPOTS[id]; if (!sp) return;
    var web = safeUrl(sp.website);
    var h = (photo(sp.photo) ? '<div class="banner" style="--c:' + color(sp.category) + '"><img alt="" src="' + esc(photo(sp.photo)) + '"></div>' : '') + '<div class="spothead">' + logo(sp, 'big') + '<div><h2>' + esc(sp.name) + '</h2><p class="sub">' + esc(sp.category) + (sp.price ? ' · ' + esc(sp.price) : '') + '</p>' + tagsHtml(sp) + '</div></div>';
    if (sp.blurb) h += '<p style="margin:0">' + esc(sp.blurb) + '</p>';
    h += '<div class="btnrow">' + (web ? '<a class="btn hot" target="_blank" rel="noopener" href="' + esc(web) + '">Website</a>' : '<a class="btn hot" target="_blank" rel="noopener" href="https://www.google.com/search?q=' + encodeURIComponent(sp.name + ' ' + (sp.address || town().name + ' Ohio')) + '">Look it up</a>') +
      '<a class="btn ghost" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(sp.name + ' ' + (sp.address || town().name + ' Ohio')) + '">Directions</a></div>';
    if (sp.address) h += '<p class="note">' + esc(sp.address) + '</p>';
    h += '<div class="sechead"><h2>Deals this week</h2></div>';
    var withDeals = DAYS.filter(function (d) { return (sp.deals || []).some(function (x) { return x.days.indexOf(d) >= 0; }); });
    if (withDeals.length) {
      h += '<div class="week">' + withDeals.map(function (d) {
        return '<div class="wd' + (d === S.day ? ' sel' : '') + '"><b>' + d + '</b><div>' + sp.deals.filter(function (x) { return x.days.indexOf(d) >= 0; }).map(function (x) {
          var u = safeUrl(x.sourceUrl);
          return '<div class="wdeal"><strong>' + esc(x.title) + (x.price && x.title.indexOf(x.price) < 0 ? ' · ' + esc(x.price) : '') + '</strong><span>' + esc(x.details) + '</span>' +
            (u ? '<a target="_blank" rel="noopener" href="' + esc(u) + '">Source: ' + esc(domain(u)) + (x.sourceDate ? ' (' + esc(x.sourceDate) + ')' : '') + '</a>' : '') + '</div>';
        }).join('') + '</div></div>';
      }).join('') + '</div>';
    } else h += '<div class="empty">No weekly deal found here yet.</div>';
    h += '<div class="sechead"><h2>Your review</h2></div>' + starsHtml(id) +
      '<label class="field" for="noteIn">What should people order?<textarea id="noteIn" data-id="' + esc(id) + '" maxlength="240" placeholder="Optional">' + esc(U.notes[id] || '') + '</textarea></label>';
    document.getElementById('sheetRoot').innerHTML = '<div class="scrim" data-close><div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(sp.name) + '"><div class="sheethead"><button class="x" data-close aria-label="Close">×</button></div><div class="sheetbody">' + h + '</div></div></div>';
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('button, a, [data-close]'); if (!t) return;
    if (t.matches('[data-close]') && (e.target === t || t.classList.contains('x'))) { closeSheet(); return render(); }
    if (t.dataset.rate) { var id = t.dataset.id, n = +t.dataset.rate; if (U.ratings[id] === n) delete U.ratings[id]; else U.ratings[id] = n; save('kord.user', U); t.parentNode.outerHTML = starsHtml(id); return; }
    if (t.dataset.spot) return spotSheet(t.dataset.spot);
    if (t.dataset.town) { S.town = t.dataset.town; S.picking = false; S.tab = 'deals'; S.q = ''; S.day = TODAY; render(); window.scrollTo(0, 0); return; }
    if (t.dataset.day) { S.day = t.dataset.day; return render(); }
    if (t.dataset.tab) { S.tab = t.dataset.tab; render(); window.scrollTo(0, 0); try { history.replaceState(null, '', '#' + S.tab); } catch (err) {} return; }
    if (t.dataset.local) { S.localOnly = t.dataset.local === '1'; return render(); }
    if (t.id === 'swapBtn') { S.picking = true; render(); window.scrollTo(0, 0); }
  });
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'spotSearch') { S.q = t.value; render(); var n = document.getElementById('spotSearch'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
    if (t.id === 'nameIn') { U.name = t.value.trim(); save('kord.user', U); }
    if (t.id === 'noteIn') { var v = t.value.trim(); if (v) U.notes[t.dataset.id] = v; else delete U.notes[t.dataset.id]; save('kord.user', U); }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'nameIn') render();
    if (t.id === 'avatarFile' && t.files && t.files[0]) {
      var fr = new FileReader();
      fr.onload = function () { var im = new Image(); im.onload = function () {
        var c = document.createElement('canvas'), s = Math.min(im.width, im.height); c.width = c.height = 192;
        c.getContext('2d').drawImage(im, (im.width - s) / 2, (im.height - s) / 2, s, s, 0, 0, 192, 192);
        U.avatar = c.toDataURL('image/jpeg', .82); save('kord.user', U); render();
      }; im.src = fr.result; };
      fr.readAsDataURL(t.files[0]);
    }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeSheet(); if (DATA) render(); } });

  fetch('data/kord.json').then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (d) {
    DATA = d;
    d.towns.forEach(function (t) { t.spots.forEach(function (s) { SPOTS[s.id] = s; }); });
    var h = (location.hash || '').slice(1); if (['deals', 'places', 'you'].indexOf(h) >= 0) S.tab = h;
    render();
  }).catch(function () {
    document.getElementById('view').innerHTML = '<div class="empty"><b>Could not load the deals</b>Check your connection and reopen KORD.</div>';
  });
})();
</script>

<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});</script>
</body>
</html>
